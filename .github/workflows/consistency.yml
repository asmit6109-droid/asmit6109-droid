name: ASMIT.EXE Consistency Engine

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update stats
        run: python update_stats.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Save updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/consistency-engine.svg
          git diff --cached --quiet || git commit -m "Update consistency stats"
          git push
