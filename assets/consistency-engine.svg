<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="270"
     viewBox="0 0 900 270">

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111C17"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="flame" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0%" stop-color="#087A3D"/>
      <stop offset="50%" stop-color="#20D96B"/>
      <stop offset="100%" stop-color="#B5FFD0"/>
    </linearGradient>

    <radialGradient id="fireGlow">
      <stop offset="0%" stop-color="#39FF88" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Main background -->
  <rect x="8" y="8" width="884" height="254" rx="18"
        fill="url(#panel)" stroke="#24392D"/>

  <!-- Header -->
  <text x="38" y="45" fill="#39FF88"
        font-family="Arial" font-size="12"
        font-weight="bold" letter-spacing="3">
    ASMIT.EXE / CONSISTENCY ENGINE
  </text>

  <circle cx="856" cy="39" r="5" fill="#39FF88">
    <animate attributeName="opacity"
             values="1;.3;1" dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="38" y="67" fill="#687B70"
        font-family="Arial" font-size="10"
        letter-spacing="2">
    DISCIPLINE IS A SYSTEM. NOT A MOOD.
  </text>

  <path d="M38 88 H862" stroke="#24392D"/>

  <!-- CURRENT STREAK -->
  <g transform="translate(45 105)">

    <text x="0" y="13" fill="#8B9C91"
          font-family="Arial" font-size="11"
          letter-spacing="2">CURRENT STREAK</text>

    <!-- Glow -->
    <ellipse cx="49" cy="94" rx="43" ry="48"
             fill="url(#fireGlow)" filter="url(#glow)">
      <animate attributeName="opacity"
               values=".5;1;.5" dur="1.8s"
               repeatCount="indefinite"/>
    </ellipse>

    <!-- Outer flame -->
    <path d="M49 145
             C9 133 25 94 42 75
             C38 102 57 100 54 57
             C83 91 91 110 73 135
             C68 143 57 147 49 145Z"
          fill="url(#flame)">
      <animateTransform attributeName="transform"
                        type="scale"
                        values="1 1;1.04 .96;.97 1.04;1 1"
                        dur="1.1s"
                        repeatCount="indefinite"
                        additive="sum"/>
    </path>

    <!-- Inner flame -->
    <path d="M50 135
             C30 125 44 104 51 91
             C54 108 69 111 64 128
             C61 135 55 138 50 135Z"
          fill="#D1FFE0">
      <animate attributeName="opacity"
               values=".7;1;.7" dur=".9s"
               repeatCount="indefinite"/>
    </path>

    <!-- Sparks -->
    <g fill="#39FF88">
      <circle cx="13" cy="81" r="2">
        <animate attributeName="cy"
                 values="81;54;81" dur="2s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values="1;0;1" dur="2s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="91" cy="97" r="2">
        <animate attributeName="cy"
                 values="97;67;97" dur="2.5s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values="0;1;0" dur="2.5s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="73" cy="61" r="1.5">
        <animate attributeName="cy"
                 values="61;42;61" dur="1.8s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values="0;1;0" dur="1.8s"
                 repeatCount="indefinite"/>
      </circle>
    </g>

    <text id="current-streak" x="120" y="100" fill="#F0FFF5"
      font-family="Arial" font-size="47"
      font-weight="bold">25</text>

    <text x="123" y="124" fill="#39FF88"
          font-family="Arial" font-size="10"
          letter-spacing="2">DAYS ACTIVE</text>
  </g>

  <path d="M330 111 V225" stroke="#24392D"/>

  <!-- LONGEST STREAK -->
  <g transform="translate(365 112)">
    <text x="0" y="6" fill="#8B9C91"
          font-family="Arial" font-size="11"
          letter-spacing="2">PERSONAL BEST</text>
   
     <text id="longest-streak" x="0" y="68" fill="#F0FFF5"
      font-family="Arial" font-size="48"
      font-weight="bold">25</text>


    <text x="3" y="91" fill="#39FF88"
          font-family="Arial" font-size="10"
          letter-spacing="2">LONGEST STREAK</text>

    <path d="M0 108 H175" stroke="#24392D"/>

    <text x="0" y="130" fill="#687B70"
          font-family="Arial" font-size="10">
      BUILT THROUGH CONSISTENCY
    </text>
  </g>

  <path d="M590 111 V225" stroke="#24392D"/>

  <!-- TOTAL CONTRIBUTIONS -->
  <g transform="translate(625 112)">
    <text x="0" y="6" fill="#8B9C91"
          font-family="Arial" font-size="11"
          letter-spacing="2">TOTAL CONTRIBUTIONS</text>

    <text id="total-contributions" x="0" y="68" fill="#F0FFF5"
      font-family="Arial" font-size="48"
      font-weight="bold">238</text>

    <text x="3" y="91" fill="#39FF88"
          font-family="Arial" font-size="10"
          letter-spacing="2">CONTRIBUTIONS</text>

    <path d="M0 108 H210" stroke="#24392D"/>

    <text x="0" y="130" fill="#687B70"
          font-family="Arial" font-size="10">
      EVERY COMMIT COUNTS.
    </text>
  </g>

  <!-- Footer -->
  <text x="38" y="246" fill="#52645A"
        font-family="Arial" font-size="9"
        letter-spacing="2">
    KEEP BUILDING. KEEP SHOWING UP.
  </text>

  <text x="862" y="246" text-anchor="end"
        fill="#39FF88" font-family="Arial"
        font-size="9" letter-spacing="2">
    SYSTEM ONLINE
  </text>

</svg>
