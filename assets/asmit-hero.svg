<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200"
     height="320"
     viewBox="0 0 1200 320">

  <defs>
    <radialGradient id="emeraldOrb">
      <stop offset="0%" stop-color="#39FF88" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#20C968" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="particleGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="#0D1117"/>

  <!-- Main breathing orb -->
  <g>
    <circle cx="600" cy="150" r="135"
            fill="#39FF88" opacity="0.10"
            filter="url(#softGlow)">
      <animate attributeName="r"
               values="115;145;165;145;115"
               dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="0.08;0.18;0.12;0.18;0.08"
               dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="600" cy="150" r="125"
            fill="url(#emeraldOrb)">
      <animate attributeName="r"
               values="110;130;150;130;110"
               dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating particles: left side -->
  <g fill="#39FF88">
    <circle cx="390" cy="100" r="2">
      <animate attributeName="cy" values="100;86;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="455" cy="225" r="2.5">
      <animate attributeName="cy" values="225;207;225" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="505" cy="70" r="1.8">
      <animate attributeName="cy" values="70;58;70" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating particles: right side -->
  <g fill="#39FF88">
    <circle cx="810" cy="95" r="2.5">
      <animate attributeName="cy" values="95;78;95" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="750" cy="230" r="2">
      <animate attributeName="cy" values="230;214;230" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="690" cy="65" r="1.8">
      <animate attributeName="cy" values="65;52;65" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Tiny sparkle accents -->
  <g fill="#A5FFC9" opacity="0.8">
    <path d="M350 155 L353 163 L361 166 L353 169 L350 177 L347 169 L339 166 L347 163 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </path>

    <path d="M850 150 L853 158 L861 161 L853 164 L850 172 L847 164 L839 161 L847 158 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground typography -->
  <text x="600" y="170"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="76"
        font-weight="800"
        letter-spacing="3"
        fill="#F4F7F5">
    ASMIT.EXE
  </text>

  <!-- Subtle underline -->
  <rect x="525" y="194" width="150" height="2" rx="1"
        fill="#39FF88" opacity="0.8"/>

</svg>
